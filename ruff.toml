# Ruff: tests are stdlib-only and use tomllib (Python 3.11+); without a
# target-version ruff classifies tomllib as third-party and flags imports.
target-version = "py311"

[lint.isort]
known-first-party = [
    "antigravity_usage",
    "claude_max_usage",
    "cursor_usage",
    "glm_usage",
    "grok_usage",
    "kimi_usage",
    "herdr_model_lanes",
]
