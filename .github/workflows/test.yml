name: test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff==0.16.3
      - name: Byte-compile sources
        run: python -m py_compile herdr_model_quota.py claude_max_usage.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check herdr_model_quota.py claude_max_usage.py tests
      - name: Format check
        run: ruff format --check herdr_model_quota.py claude_max_usage.py tests
